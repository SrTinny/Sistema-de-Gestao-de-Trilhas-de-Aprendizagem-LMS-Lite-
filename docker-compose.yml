services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: lmslite
      POSTGRES_USER: lmsuser
      POSTGRES_PASSWORD: lmspass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmsuser -d lmslite"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: python /app/lmslite/manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend/lmslite:/app/lmslite
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=settings
      - DB_HOST=db
      - DB_NAME=lmslite
      - DB_USER=lmsuser
      - DB_PASSWORD=lmspass
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata: